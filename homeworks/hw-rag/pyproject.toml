[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsrag"
version = "0.1.0"
description = "HW2: agent with a search tool over the MultiHop-RAG news archive"
requires-python = ">=3.11"
dependencies = ["openai>=1.40,<4", "snowballstemmer>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
baselines = ["rank-bm25>=0.2.2"]

[tool.setuptools]
packages = ["newsrag"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
